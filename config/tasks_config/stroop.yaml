task_name: stroop
display_name: "Stroop"

stimulus:
  word_height: 0.15
  fixation_height: 0.1

colors:
  rouge: [1.0, -1.0, -1.0]
  bleu:  [-1.0, -1.0, 1.0]
  vert:  [-1.0, 0.8, -1.0]

color_words:
  rouge: "ROUGE"
  bleu:  "BLEU"
  vert:  "VERT"

neutral_words: ["XXXX", "%%%%", "OOOO"]

# Incongruent: toutes les combinaisons mot/couleur differentes
incongruent_pairs:
  - { word: "ROUGE", ink: "bleu" }
  - { word: "ROUGE", ink: "vert" }
  - { word: "BLEU",  ink: "rouge" }
  - { word: "BLEU",  ink: "vert" }
  - { word: "VERT",  ink: "rouge" }
  - { word: "VERT",  ink: "bleu" }

response_keys_pc:
  rouge: "left"
  bleu:  "down"
  vert:  "right"

response_keys_fmri:
  rouge: "b"
  bleu:  "y"
  vert:  "g"

# Rappel touches affiche en permanence en bas de l'ecran
show_key_reminder: true
key_reminder_height: 0.04
key_reminder_y: -0.85

ttl_codes:
  stim_congruent: 110
  stim_incongruent: 111
  stim_neutral: 112
  response_correct: 160
  response_incorrect: 161
  block_neutral: 20
  block_incongruent: 21
  block_congruent: 22

