# ═══════════════════════════════════════════════════════════════════
# Stroop Task — Design Configuration
#
# Reference: Banich et al. (2000) blocked fMRI Stroop
#   - 3 ink colors: red, orange, green
#   - 3 trial types: congruent, incongruent, neutral
#   - Trial: 300ms fixation + 1200ms stimulus + 500ms ITI = 2s
#   - Neutral trials intermixed 50:50 in con/inc blocks
# ═══════════════════════════════════════════════════════════════════

task_name: stroop
display_name: "Stroop"

stimulus:
  word_height: 0.15
  fixation_height: 0.1

# PsychoPy RGB norm (-1 to 1)
colors:
  red:    [1.0, -1.0, -1.0]
  orange: [1.0,  0.3, -1.0]
  green:  [-1.0, 0.8, -1.0]

color_words:
  red: "RED"
  orange: "ORANGE"
  green: "GREEN"

# Neutral words matched for length with their color-word counterpart
neutral_words:
  red:    ["LOT", "SET", "PIN", "MAP", "PEN"]
  green:  ["CHAIR", "PLANE", "TABLE", "SHELF", "STONE"]
  orange: ["BRIDGE", "PLANET", "STAPLE", "MARBLE", "PENCIL"]

response_keys_pc:
  red: "left"
  orange: "down"
  green: "right"

response_keys_fmri:
  red: "b"
  orange: "y"
  green: "g"

ttl_codes:
  stim_congruent: 110
  stim_incongruent: 111
  stim_neutral: 112
  response_correct: 160
  response_incorrect: 161
  block_neutral: 20
  block_incongruent: 21
  block_congruent: 22

designs:

  1:
    name: "Blocked Order A (N-I-N-C x4, ~13min)"
    paradigm: block
    fixation_duration: 0.3
    stim_duration: 1.2
    iti_duration: 0.5
    rest_duration: 10.0
    instruction_duration: 3.0
    pre_block_fixation: 1.0
    prop_neutral_mix: 0.5
    blocks:
      # N-I-N-C repeated 4 times
      - { condition: neutral,      n_trials: 18 }
      - { condition: incongruent,  n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: congruent,    n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: incongruent,  n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: congruent,    n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: incongruent,  n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: congruent,    n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: incongruent,  n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: congruent,    n_trials: 18 }

  2:
    name: "Blocked Order B (N-C-N-I x4, ~13min)"
    paradigm: block
    fixation_duration: 0.3
    stim_duration: 1.2
    iti_duration: 0.5
    rest_duration: 10.0
    instruction_duration: 3.0
    pre_block_fixation: 1.0
    prop_neutral_mix: 0.5
    blocks:
      # Counterbalanced: N-C-N-I repeated 4 times
      - { condition: neutral,      n_trials: 18 }
      - { condition: congruent,    n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: incongruent,  n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: congruent,    n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: incongruent,  n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: congruent,    n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: incongruent,  n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: congruent,    n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: incongruent,  n_trials: 18 }

  3:
    name: "Short blocked (N-I-N-C x2, ~7min)"
    paradigm: block
    fixation_duration: 0.3
    stim_duration: 1.2
    iti_duration: 0.5
    rest_duration: 10.0
    instruction_duration: 3.0
    pre_block_fixation: 1.0
    prop_neutral_mix: 0.5
    blocks:
      - { condition: neutral,      n_trials: 18 }
      - { condition: incongruent,  n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: congruent,    n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: incongruent,  n_trials: 18 }
      - { condition: neutral,      n_trials: 18 }
      - { condition: congruent,    n_trials: 18 }

  4:
    name: "Event-related mixed (~9min)"
    paradigm: event
    fixation_duration: 0.3
    stim_duration: 1.2
    iti_duration: 0.5
    rest_duration: 12.0
    instruction_duration: 3.0
    pre_block_fixation: 1.0
    prop_neutral_mix: 0.0
    blocks:
      - { condition: mixed, n_trials: 120, prop_congruent: 0.33, prop_incongruent: 0.33 }