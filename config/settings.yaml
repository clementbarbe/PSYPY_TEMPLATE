# Configuration globale : écran, entrées/sorties et matériel.
# Les paramètres propres à chaque tâche restent dans tasks/<task>/config.yaml.

project:
  data_dir: data
  fullscreen: true
  default_screen: 0
  mock_mode: false
  quit_key: escape
  end_screen_seconds: 3.0

display:
  resolution: [1920, 1080]
  width_cm: 53.0
  viewing_distance_cm: 60.0
  refresh_rate: 60.0
  background_color: [-1, -1, -1]
  flip_horizontal: false
  flip_vertical: false

input:
  trigger:
    enabled: true
    source: keyboard        # keyboard | serial | parallel
    key: t
    serial_port: ""
    baudrate: 115200
    timeout_seconds: 300.0
    parallel_address: null
    parallel_pin: 10

  response_box:
    backend: keyboard       # keyboard | serial
    serial_port: ""
    baudrate: 115200

  responses:
    left: left
    right: right
    down: down
    go: space

output:
  markers:
    enabled: false
    transport: none         # none | parallel | serial
    parallel_address: null
    serial_port: ""
    baudrate: 115200
    pulse_seconds: 0.005

audio:
  backend: ptb
  sample_rate: 48000
  schedule_lead_seconds: 0.100
  minimum_schedule_lead_seconds: 0.030

eyetracker:
  enabled: false
  backend: eyelink          # eyelink | tobii
  host: "100.1.1.1"

microphone:
  enabled: false
  sample_rate: 44100
  channels: 1
